[versions]

bluemap = "2.8.0"
folia = "26.2.build.7-beta"

# testing tool
junit = "6.1.3"

# testing environment
mockito = "5.24.0"

# gradle plugins
gradle-plugins = "1.8.6"
paperweight-userdev = "2.0.0-beta.24"

[libraries]

bluemap-api = { module = "de.bluecolored:bluemap-api", version.ref = "bluemap" }

# Not used in the project but declared here for Renovate
folia-api = { module = "dev.folia:folia-api", version.ref = "folia" }

# testing tool
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

# testing environment
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[plugins]

jcommon = { id = "dev.siroshun.gradle.plugins.jcommon", version.ref = "gradle-plugins" }
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight-userdev" }
